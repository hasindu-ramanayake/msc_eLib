services:
  # Infrastructure
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: elib
      POSTGRES_USER: ${PROD_DB_USER}
      POSTGRES_PASSWORD: ${PROD_DB_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PROD_DB_USER} -d elib" ]
      interval: 10s
      timeout: 5s
      retries: 5

  user_db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: ${PROD_DB_USER}
      POSTGRES_PASSWORD: ${PROD_DB_PASSWORD}
    volumes:
      - user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PROD_DB_USER} -d user_db" ]

  item_db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: item_db
      POSTGRES_USER: ${PROD_DB_USER}
      POSTGRES_PASSWORD: ${PROD_DB_PASSWORD}
    volumes:
      - item_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PROD_DB_USER} -d item_db" ]

  borrow_db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: borrow_db
      POSTGRES_USER: ${PROD_DB_USER}
      POSTGRES_PASSWORD: ${PROD_DB_PASSWORD}
    volumes:
      - borrow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PROD_DB_USER} -d borrow_db" ]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    restart: always
    environment:
      - "discovery.type=single-node"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/ || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.11-management
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmq-diagnostics -q check_running" ]

  eureka-server:
    image: ${DOCKER_ORG:-myrepo}/elib-discovery-server:latest
    restart: always
    ports:
      - "8761:8761"
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8761/actuator/health || exit 1" ]

  # Microservices
  user-service:
    image: ${DOCKER_ORG:-myrepo}/elib-user-service:latest
    restart: always
    environment:
      USER_SERVICE_SPRING_DATASOURCE_USERNAME: ${PROD_DB_USER}
      USER_SERVICE_SPRING_DATASOURCE_PASSWORD: ${PROD_DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://user_db:5432/user_db
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      - user_db
      - eureka-server

  apigateway:
    image: ${DOCKER_ORG:-myrepo}/elib-api-gateway:latest
    restart: always
    ports:
      - "8765:8765"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server

  notification-service:
    image: ${DOCKER_ORG:-myrepo}/elib-notification-service:latest
    restart: always
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - rabbitmq

  event-service:
    image: ${DOCKER_ORG:-myrepo}/elib-event-service:latest
    restart: always
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server

  item-service:
    image: ${DOCKER_ORG:-myrepo}/elib-item-service:latest
    restart: always
    environment:
      ITEM_SERVICE_SPRING_DATASOURCE_USERNAME: ${PROD_DB_USER}
      ITEM_SERVICE_SPRING_DATASOURCE_PASSWORD: ${PROD_DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://item_db:5432/item_db
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - item_db

  borrow-service:
    image: ${DOCKER_ORG:-myrepo}/elib-borrowservice:latest
    restart: always
    environment:
      SPRING_DATASOURCE_USERNAME: ${PROD_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${PROD_DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://borrow_db:5432/borrow_db
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - borrow_db

  borrow-batch-service:
    image: ${DOCKER_ORG:-myrepo}/elib-borrow-batch-service:latest
    restart: always
    environment:
      SPRING_DATASOURCE_USERNAME: ${PROD_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${PROD_DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - borrow_db
      - eureka-server

  search-service:
    image: ${DOCKER_ORG:-myrepo}/elib-search-service:latest
    restart: always
    environment:
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - elasticsearch
      - eureka-server

  frontend:
    image: ${DOCKER_ORG:-myrepo}/elib-frontend:latest
    restart: always
    ports:
      - "80:80"
    depends_on:
      - apigateway

volumes:
  user_db_data:
  item_db_data:
  borrow_db_data:
  es_data:
